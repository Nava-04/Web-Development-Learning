<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    // forlopp
    for(let i=1; i<=10; i++){
        console.log(i)
    }//1-10
    for(let a=45;a<48;a++){
        console.log(a)
    }//45-47

    //while loop
    let b=14;
    while(b<20){
        console.log(b)
        b++
    }//14-19

    let c=100;
    while(c>90){
        console.log(c)
        c++
    }
</script>
</body>
</html>
