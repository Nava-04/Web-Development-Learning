<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColorProperties</title>
    <style>
        #demo{
            height: 300px;
            width:300px;
            border:5px solid green;

            /* Color NAme: */
            background-color: red;
            background-color: green;

            /* Hexadecimal Value: */
            background-color: #341234;
            background-color: #ab24fd;
            background-color: #fff;
            background-color: #000;

            /* RGB(RED,GREEN,BLUE) */
            background-color:rgb(255,200,150);
            background-color:rgb(50,80,255);
            background-color: rgb(255,0,0);

            /* RGBA(RED,GREEN,BLUE,ALPHA) Alpha Means Blurness*/

            background-color:rgba(200,100,200,0.5);
            background-color:rgba(150,180,200,1);

            /* HSL(HUE SATURATION LIGHTNESS) */

            background-color:hsl(300,60%,50%);
            background-color:hsl(150,70%,50%);
            
            /* HSLA(HUE SATURATION LIGHTNESS ALPHA) */

            background-color:hsla(100,80%,30%,0.9);
            background-color:hsla(220,90%,50%,0.9);


        }
    </style>
</head>
<body>
    <diV id="demo">
    </diV>
</body>
</html>
