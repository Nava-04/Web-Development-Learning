<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Units</title>
    <style>
        #demo1{
            height:100px;
            width:100px;
            border:1px solid black;
            background-color:aqua;
        }
        #demo2{
            height:150px;
            width:50%;
            border:3px solid black;
            background-color:yellow;
        }
        #demo3{
            height:20em;
            width:20em;
            border:1px solid black;
            background-color: blue;
        }
        #demo4{
            height:20rem;
            width:20rem;
            background-color: chartreuse;
        }
        #demo5{
            height:40vh;
            width:50vw;
            background-color: orange;
        }
    </style>
</head>
<body>
    <!--Pixel-->
    <div id="demo1"></div>
    <hr>
    <!--%perc-->
    <div id="demo2"></div>
    <hr>
    <!--em-->
    <div id="demo3"></div>
    <hr>
    <!--rem-->
    <div id="demo4"></div>
    <hr>
    <!--vh And vw-->
    <div id="demo5"></div>

</body>
</html>
