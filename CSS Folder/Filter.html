<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
           height:300px;
           width:300px;
           position:relative;
           top:100px;
           left:400px;
           border-radius:10px;
           filter:blur(2px);
           filter:blur(1.5px);
           filter:grayscale(60%);
           filter:grayscale(100%);
           filter:contrast(40%);
           filter:contrast(150%);
           filter:invert(100%);
           filter:invert(200%);
           filter:sepia(100%);
           filter:sepia(200%);
           filter:saturate(300%);
           filter:saturate(200%);
           filter:hue-rotate(60deg);
           filter:hue-rotate(90deg);
           filter:drop-shadow(10px 10px 10px black);
           filter:drop-shadow(10px 10px 10px black) blur(1.5px) grayscale(100%) contrast(150%)  sepia(200%) saturate(200%);
        }
    </style>
</head>
<body>
    <img src="../images/Nature.png" alt="">
    
</body>
</html>
