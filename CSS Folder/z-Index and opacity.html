<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Index and Opacity</title>
    <style>
        img{
            height:200px;
            width: 150px;
            z-index:40;
            position: absolute;
            left: 500px;
            opacity:0.8;
            top: 200px;
        }
        p{
            height:200px;
            width: 150px;
            z-index:20;
            position: relative;
            left: 500px;
            top:200px;
        
            
        }
    </style>
</head>
<body>
   <img src="../images/Sukuna.png" alt="" >
   <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Modi saepe iure nesciunt commodi accusantium placeat quam labore. Voluptatum, laborum vero.</p>
</body>
</html>
