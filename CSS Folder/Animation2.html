<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation2</title>
    <style>
        #demo{
            height:80px;
            width:80px;
            border:2px solid black;
            border-radius:10%;
            background-color: red;
            animation-duration:2s;
            animation-delay:1s;
            animation-iteration-count:6;
            animation-name: nithi;
        }
        @keyframes nithi{
            35%{
                height:100px;
                width:100px;
                border:2px solid black;
                border-radius:20%;
                background-image:url(../images/Sukuna.png);
                transform:translatex(300px);
                background-size:cover;
            }
            35%{
                height:120px;
                width:120px;
                border:2px solid black;
                border-radius:40%;
                background-color: rgb(38, 255, 0);
                transform:translatey(300px);
            }
            35%{
                 height:140px;
                width:140px;
                border:2px solid black;
                border-radius:60%;
                background-color: rgb(221, 255, 0);
                transform:translatex(300px);

            }
            35%{
                 height:160px;
                width:160px;
                border:2px solid black;
                border-radius:60%;
                background-color: rgb(255, 0, 217);
                transform:translatey(300px);

            }
        }
    </style>
</head>
<body>
    <div id="demo"></div>
</body>
</html>
