<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisplayProperties</title>
    <style>
        span,img,video,input{
            display: block;
        }
        span{
            height:50px;
            width:100px;
            border:2px solid black;
        }
        h2,div,p,h1{
            display: inline;
        }
        h2{
            height: 200px;
            width: 100px;
            border:2px solid black;
        }
        h3,h4{
            display:inline-block;
        }
        h3{
             height: 200px;
            width: 100px;
            border:2px solid black;
        }
       
       

    </style>
</head>
<body>
    <!--DISPLAY-BLOCK-->
    <span>NAVANITHI</span>
    <img src="../images/Sukuna.png" alt="" height="200px" width="200px">
    <video src="../Video/361729_medium.mp4"controls height="200px" width="200px"></video>
    <br>
    <input type="text">
    <!--DISPLAY INLINE-->
    <h2>HELLO WORLD</h2>&emsp;
    <p>Paragraph</p>
    <div>Chintuu</div>
    <h1>Mintuu</h1>
    <hr>
    <!--DISPLAY INLINE-BLOCK-->
   
    <h3>Heloo My boyy</h3>
    <h4>Chotta Bheem</h4>

    
    
</body>
</html>
