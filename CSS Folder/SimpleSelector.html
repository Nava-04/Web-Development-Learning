<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple</title>
    <style>
        #demo1{
            color: red;
            background-color: aquamarine;
            text-align: center;
            border-radius: 5    0px;
        }
        #demo2{
            color: chartreuse;
            background-color: crimson;
            text-align: center;
             border-radius: 50px;
        }
        #demo3{
            color:white;
            background-color: black;
            text-align: center;
             border-radius: 50px;
        }
        #demo4{
            color: black;
            background-color: green;
            text-align: center;
             border-radius: 50px;
        }
        .cls{
            color: rgb(255, 1, 1);
            background-color: grey;
            padding: 10px;
            text-align: center;
            border: 2px solid blueviolet;
            border-radius: 50px;
        }
        div{
            color:rgb(233, 190, 239);
            background-color: rgb(0, 0, 0);
            text-align: center;
            border-radius: 50px;
        }
        h1{
            color: blue;
            background-color: rgb(165, 92, 2);
            text-align: center;
            border-radius: 50px;
        }
        h2,h3,h4,h5{
            color: black;
            background-color: palevioletred;
            text-align: center;
            border-radius: 50px;
        }
        *{
            color: rgb(0, 0, 0);
            background-color: rgb(93, 252, 8);
            text-align: center;
           
        }
    </style>
</head>
<body>

    <!--ID(#)-->

    <h1 id="demo1">HTML</h1>
    <h1 id="demo2">CSS</h1>
    <h1 id="demo3">JAVASCRIPT</h1>
    <h1 id="demo4">REACT</h1>
    <hr>
    <!--CLASS(.)-->
    <p class="cls">NAVA</p>
    <h2 class="cls">Nithi</h2>
    <h3 class="cls">MS DHONI</h3>
    <h1 class="cls">CM VIJAY</h1>
    <hr>
    <!-- TAG SELECTOR-->

    <div>HELLO GUYSSS😎</div>

    <h2>NAVANITHI</h2>

</body>
</html>
