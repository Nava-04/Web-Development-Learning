<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        div{
            color:red;
            background-color:yellow;
            height: 200px;
            width: 200px;
            padding:40px;
            padding-top:100px;
            padding-right:30px;
            padding-bottom:10px;
            padding-left:100px;
            /* padding:100px 30px 80px 50px;
            padding: 100px 10px; */


            /* border:4px solid black; */

            border-top:4px solid black;
            border-right:4px dotted black;
            border-bottom:4px dashed black;
            border-left:4px double black;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            font-style: italic;

            /* margin */

            margin:50px;
            margin-top:250px;
            margin-left:300px;
            margin-right:100px;
            margin-bottom:150px;


        }
    </style>
</head>

    <div>
        <p>NAVANITHI</p>

</html>
